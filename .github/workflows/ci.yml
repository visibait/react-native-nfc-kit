name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Covers the library and the config plugin. The plugin having its own
      # tsconfig is not an excuse for it to go unchecked.
      - run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared engines floor and the current LTS.
        node: ['20.19.4', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Jest with coverage thresholds
        run: npm run test:coverage

  package:
    name: Package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # publint and arethetypeswrong run against the actual packed tarball, so a
      # broken exports map or an ESM/CJS mismatch fails here rather than in a
      # consumer's bundler. This is how packages ship untranspiled output.
      - run: npm run verify:package

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Install and build the library
        run: npm ci --ignore-scripts && npm run build

      - name: Install the example app
        working-directory: example
        run: npm install --no-audit --no-fund

      # prebuild runs the config plugin, so a plugin that produces an invalid
      # manifest or entitlements file fails here rather than in a user's project.
      - name: Prebuild (runs the config plugin)
        working-directory: example
        run: npx expo prebuild -p android --clean
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Check the plugin wrote what it should
        working-directory: example
        run: |
          set -e
          manifest=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.NFC' "$manifest"
          grep -q 'android:name="android.hardware.nfc" android:required="false"' "$manifest"
          grep -q 'android:launchMode="singleTop"' "$manifest"
          grep -q 'android.nfc.action.NDEF_DISCOVERED' "$manifest"
          grep -q 'android:mimeType="application/vnd.nfckit.example"' "$manifest"
          grep -q 'android.nfc.action.TECH_DISCOVERED' "$manifest"
          grep -q '@xml/nfc_kit_tech_filter' "$manifest"
          # The example sets dispatchNfcMessagePermission to false, so the
          # permission must be absent. An option that is ignored is worse than one
          # that is missing, because it reads as if it worked.
          #
          # Spelled out rather than `! grep -q ...`: POSIX disables `set -e` for a
          # command whose status is inverted by `!`, so that form never fails.
          if grep -q 'DISPATCH_NFC_MESSAGE' "$manifest"; then
            echo "DISPATCH_NFC_MESSAGE was written even though the example turned it off." >&2
            exit 1
          fi
          techFilter=android/app/src/main/res/xml/nfc_kit_tech_filter.xml
          grep -q 'android.nfc.tech.IsoDep' "$techFilter"
          grep -q 'android.nfc.tech.MifareUltralight' "$techFilter"
          # Card emulation: the service, the resource it points at, and the string
          # the resource references. A missing string is a build failure whose
          # message is about a symbol rather than about NFC.
          grep -q 'com.nfckit.hce.NfcKitHostApduService' "$manifest"
          grep -q 'android.permission.BIND_NFC_SERVICE' "$manifest"
          apduService=android/app/src/main/res/xml/nfc_kit_apduservice.xml
          grep -q 'android:name="F0010203040506"' "$apduService"
          grep -q 'nfc_kit_hce_description' android/app/src/main/res/values/strings.xml
          echo "AndroidManifest and the generated tech filter contain what the plugin should have written."

      - name: Compile the Kotlin module
        working-directory: example/android
        run: ./gradlew :react-native-nfc-kit:compileDebugKotlin

      - name: Assemble the example APK
        working-directory: example/android
        run: ./gradlew :app:assembleDebug

      # Autolinking is what actually puts the module in the app. Compiling proves
      # the Kotlin is valid; this proves it is reachable at runtime.
      - name: Check the module is registered by autolinking
        working-directory: example
        run: |
          set -e
          list=node_modules/expo/android/build/generated/expo/src/main/java/expo/modules/ExpoModulesPackageList.kt
          grep -q 'com.nfckit.NfcKitModule' "$list"
          echo "NfcKitModule is registered in the generated Expo modules list."

  ios:
    name: iOS build
    # The authoritative iOS check. Swift can be syntax-checked anywhere -- see
    # `npm run check:swift` -- but only a Mac has CoreNFC and the real
    # ExpoModulesCore, so type errors and API misuse surface here and nowhere
    # else. A contributor without a Mac relies on this job.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build the library
        run: npm ci --ignore-scripts && npm run build

      - name: Swift syntax check
        run: npm run check:swift

      - name: Install the example app
        working-directory: example
        run: npm install --no-audit --no-fund

      - name: Prebuild (runs the config plugin)
        working-directory: example
        run: npx expo prebuild -p ios --clean
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Check the plugin wrote the entitlements and usage description
        working-directory: example
        run: |
          set -e
          entitlements=$(find ios -name '*.entitlements' | head -1)
          plist=$(find ios -name 'Info.plist' -not -path '*/Pods/*' | head -1)
          grep -q 'com.apple.developer.nfc.readersession.formats' "$entitlements"
          grep -q 'TAG' "$entitlements"
          grep -q 'NFCReaderUsageDescription' "$plist"
          # These two are what decide whether iOS hands a tag over at all, so a
          # plugin that silently dropped them would look fine until a card is
          # tapped.
          grep -q 'A0000002471001' "$plist"
          grep -q '12FC' "$plist"
          echo "Entitlements carry the reader-session format; Info.plist has the usage description, the AID and the FeliCa system code."

      - name: Pod install
        working-directory: example/ios
        run: pod install

      - name: Build for a device
        working-directory: example/ios
        run: |
          xcodebuild             -workspace example.xcworkspace             -scheme example             -configuration Debug             -sdk iphoneos             -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build | tail -40

  example-types:
    name: Example app typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Builds first: the example imports the package through its exports map, so
      # this checks the published type surface rather than the source.
      - run: npm run build
      - working-directory: example
        run: npm install --no-audit --no-fund
      - working-directory: example
        run: npx tsc --noEmit
